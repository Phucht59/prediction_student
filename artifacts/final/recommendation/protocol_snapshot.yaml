schema_version: v6_2_recommendation_scientific_validation_protocol_v1
status: FROZEN_BEFORE_REAL_EXPERT_LABEL_IMPORT
decision_date: 2026-07-25
scope:
  purpose: validate recommendation semantics, safety, reproducibility, and expert-evaluation readiness
  prediction_training: PROHIBITED
  hyperparameter_search: PROHIBITED
  outer_evaluation: PROHIBITED
  future_oulad: LOCKED_NOT_ACCESSED
  frozen_evidence_mutation: PROHIBITED
recommendation:
  observed_behavior_source: real_pre_cutoff_features_only
  probability_to_observed_behavior: PROHIBITED
  withdrawal_mechanism: EXPLORATORY_DISABLED_FOR_RECOMMENDATION
  max_actions: 4
  max_weekly_minutes: 180
  high_disagreement_abstention_threshold: 0.25
  low_confidence_policy: ABSTAIN_HUMAN_REVIEW
expert_evaluation:
  cases: 60
  reviewers_prepared: [E01, E02]
  real_labels_required: true
  synthetic_labels: PROHIBITED
  llm_labels: PROHIBITED
  heuristic_labels: PROHIBITED
  selection_dimensions:
    - risk_band
    - confidence
    - abstention
    - fail_risk_band
    - disagreement_band
    - module
    - presentation
  selection_excludes: [demographics, observed_outcome, prediction_correctness]
  blinding_excludes:
    - model_identity
    - exact_probabilities
    - source_record_ids
    - student_ids
    - outcomes
  questions:
    q1_plan_score: integer_1_to_5
    q2_action_relevance: [APPROVE, PARTIAL, UNSURE, REJECT]
    q3_missing_action: [YES, NO]
    q4_escalation: [CORRECT, OVER_ESCALATED, UNDER_ESCALATED, UNSURE]
    q5_reason_support: [SUPPORTED, PARTIAL, UNSUPPORTED, UNSURE]
    q6_safety_workload: [SAFE, CONCERN, UNSAFE, UNSURE]
  bootstrap:
    unit: case_id_with_all_reviewer_rows_retained
    draws: 2000
    seed: 6202
    confidence: 0.95
claims:
  recommendation_effectiveness: NOT_ESTABLISHED
  causal_student_outcome_improvement: PROHIBITED
  expert_approval_before_real_labels: PROHIBITED
  future_generalization: NOT_EVALUATED
database:
  migration_policy: additive_only
  mutation_requires_explicit_disposable_test_dsn: true
