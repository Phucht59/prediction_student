  - source_id: JISC_LEARNING_ANALYTICS_CODE_2023
    title: Code of practice for learning analytics
    organization_or_authors: Jisc; Niall Sclater and Paul Bailey
    publication_year_or_version: "2015, updated 2023"
    source_type: OFFICIAL_ETHICS_CODE
    url: https://www.jisc.ac.uk/guides/code-of-practice-for-learning-analytics
    retrieved_at: "2026-08-02"
    target_population: Educational institutions implementing learning analytics
    supported_action_ids: [INSTRUCTOR_CONTACT, ADVISOR_ESCALATION, ADVISOR_SUPPORT, PROGRESS_MONITORING]
    evidence_summary: Requires responsibility, transparency, privacy, validity, positive interventions, minimization of adverse impact, and data stewardship.
