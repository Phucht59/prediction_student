schema_version: recommend_scientific_source_registry_v1
sources:
  - source_id: SNORKEL_VLDB_2017
    title: "Snorkel: Rapid Training Data Creation with Weak Supervision"
    organization_or_authors: "Alexander Ratner, Stephen H. Bach, Henry Ehrenberg, Jason Fries, Sen Wu, Christopher Re"
    publication_year_or_version: "2017"
    source_type: PEER_REVIEWED_METHOD_PAPER
    url: https://www.vldb.org/pvldb/vol11/p269-ratner.pdf
    retrieved_at: "2026-08-02"
    target_population: Machine-learning development workflows; not an educational intervention population
    supported_action_ids: []
    evidence_summary: Labeling functions may overlap, conflict, or abstain; a generative label model can combine their outputs into probabilistic labels.
    applicability_limits: Supports the weak-supervision method only and supplies no evidence that any educational action is effective.
    verification_status: VERIFIED
  - source_id: WWC_STUDY_2007
    title: Organizing Instruction and Study to Improve Student Learning
    organization_or_authors: What Works Clearinghouse, Institute of Education Sciences
    publication_year_or_version: "2007"
    source_type: OFFICIAL_PRACTICE_GUIDE
    url: https://ies.ed.gov/ncee/wwc/PracticeGuide/1
    retrieved_at: "2026-08-02"
    target_population: K-12 and postsecondary learners in content-learning settings
    supported_action_ids: [TARGETED_PRACTICE, RETRIEVAL_PRACTICE, STUDY_SCHEDULE, PROGRESS_MONITORING, LEARNING_CONSOLIDATION, TARGETED_REVISION, PRACTICE_EXERCISES, ASSESSMENT_PREPARATION]
    evidence_summary: Supports spaced study, active retrieval, quizzes to identify learning needs, and prompts for deeper explanation.
    applicability_limits: Recommendations are group-level practice guidance; they do not prove suitability or benefit for a particular predicted-risk student.
    verification_status: VERIFIED
  - source_id: WWC_TECH_POSTSECONDARY_2019
    title: Using Technology to Support Postsecondary Student Learning
    organization_or_authors: What Works Clearinghouse, Institute of Education Sciences
    publication_year_or_version: "2019"
    source_type: OFFICIAL_PRACTICE_GUIDE
    url: https://ies.ed.gov/ncee/wwc/PracticeGuide/25
