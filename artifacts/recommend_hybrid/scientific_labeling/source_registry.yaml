  - source_id: WWC_ADVISING_2021
    title: Effective Advising for Postsecondary Students
    organization_or_authors: What Works Clearinghouse, Institute of Education Sciences
    publication_year_or_version: "2021"
    source_type: OFFICIAL_PRACTICE_GUIDE
    url: https://ies.ed.gov/ncee/wwc/practiceguide/28
    retrieved_at: "2026-08-02"
    target_population: Postsecondary students, advisors, faculty, and institutional staff
    supported_action_ids: [INSTRUCTOR_CONTACT, ADVISOR_ESCALATION, ADVISOR_SUPPORT]
    evidence_summary: Supports comprehensive advising, sustained personalized relationships, mentoring, and coaching in postsecondary settings.
