schema_version: v6_1_oulad_architecture_hypotheses_v1
status: PREREGISTERED_BEFORE_NEW_EXPERIMENT_RESULTS
registered_against_repository_sha: b9d9128bc71a83f16ddac22103c1efaa53e96329
hypotheses:
  H1_capacity_imbalance:
    statement: The current CNN may contribute little because its encoder capacity is substantially below the BiLSTM encoder.
    test: Compare small and parameter-matched CNN encoders with a capacity-matched BiLSTM in temporal-only inner CV.
  H2_serial_bottleneck:
    statement: The CNN-to-BiLSTM serial path may transform away useful CNN representation before classification.
    test: Compare current serial, serial with direct CNN skip, and parallel CNN/BiLSTM under the same development protocol.
  H3_dilation_mismatch:
    statement: Dilation two may under-represent adjacent-week patterns.
    test: Compare dilation one, dilation two, and preregistered multi-dilation branches without broad search.
  H4_aggregate_redundancy:
    statement: Compact aggregate/static branches may already encode most useful local temporal summaries.
    test: Compare temporal-only differences with the same encoders after aggregate/static fusion.
  H5_data_limitation:
    statement: F2_MIDDLE may contain little incremental local temporal signal after recurrent and engineered representations.
    test: Accept a negative result if parameter matching, dilation, skip, and parallel paths do not yield a stable inner-CV gain.
interpretation_rules:
  no_cherry_picked_seed_or_fold: true
  outer_test_for_selection: false
  future_oulad_access: false
  negative_result_is_valid: true
  gate_weight_is_not_causal_importance: true

