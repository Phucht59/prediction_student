{
  "dataset": "OULAD",
  "record_grain": [
    "code_module",
    "code_presentation",
    "id_student"
  ],
  "target": {
    "primary": "binary_at_risk",
    "positive": [
      "Withdrawn",
      "Fail"
    ],
    "negative": [
      "Pass",
      "Distinction"
    ],
    "original_values_preserved": true
  },
  "forecasts": [
    {
      "id": "F1_EARLY",
      "fraction": 0.2
    },
    {
      "id": "F2_MIDDLE",
      "fraction": 0.5
    },
    {
      "id": "F3_LATE",
      "fraction": 0.8
    }
  ],
  "cutoff_formula": "floor(module_presentation_length * forecast_fraction)",
  "event_interval": "0 <= date < cutoff_day",
  "weekly_bin_interval": "[7*k, 7*(k+1))",
  "cohort": {
    "registered_before_cutoff": true,
    "active_at_cutoff": true,
    "date_unregistration_feature_allowed": false
  },
  "temporal_channels": [
    "total_clicks",
    "active_days",
    "unique_sites",
    "unique_activity_types",
    "content_clicks",
    "forum_clicks",
    "quiz_clicks",
    "assessment_related_clicks",
    "submitted_assessment_count",
    "late_submission_count",
    "available_score_count",
    "cumulative_mean_score",
    "cumulative_weighted_score",
    "days_since_last_vle_activity",
    "weeks_without_activity",
    "score_missing_mask"
  ],
  "static_features": [
    "code_module",
    "presentation_season",
    "num_of_prev_attempts",
    "studied_credits",
    "registration_lead_time",
    "module_presentation_length"
  ],
  "excluded_features": [
    "final_result",
    "date_unregistration",
    "exact_code_presentation",
    "is_banked",
    "gender",
    "region",
    "disability",
    "age_band",
    "imd_band",
    "highest_education",
    "post_cutoff_events",
    "full_course_aggregates"
  ],
  "models": [
    "C-O0",
    "C-L0",
    "C-R0",
    "C-H0",
    "C-S0",
    "C-M0",
    "C-C0",
    "C-L1",
    "C-H1",
    "C-H2"
  ],
  "primary_tuning_forecast": "F2_MIDDLE",
  "outer_folds": 3,
  "inner_folds": 2,
  "primary_metric": "binary_macro_f1",
  "threshold_selection": "inner_oof_macro_f1_only",
  "practical_margin": 0.01,
  "seeds": [
    42,
    2026,
    3407
  ],
  "ml_trials_max": 15,
  "deep_trials_max": 6,
  "deep_max_epochs": 25,
  "deep_patience": 4,
  "future_support": {
    "historical_total_min": 150,
    "historical_positive_min": 20,
    "historical_negative_min": 20,
    "future_total_min": 60,
    "future_positive_min": 10,
    "future_negative_min": 10
  },
  "student_group_scope": "global_id_student",
  "future_test_policy": "latest_eligible_presentation_per_module; labels unopened until development freeze",
  "svm_full_gate": "smoke_runtime_and_memory",
  "class_weight_scope": "training_fold_only",
  "dl_advantage_rule": {
    "f2_macro_f1_delta_min": 0.01,
    "positive_forecasts_min": 2,
    "at_risk_recall_drop_max": 0.02,
    "pr_auc_drop_max": 0.01
  }
}
