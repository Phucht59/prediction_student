schema_version: project_v5_1_protocol_v1
protocol_status: frozen_before_outer_evaluation
frozen_at: "2026-07-18T09:45:13+07:00"
project: CNN-BiLSTM V5.1 performance improvement
branch: codex/project-v5-1-cnn-bilstm-performance
base_branch: codex/project-v5-cnn-bilstm-final
base_head: 3b5ad7746d26658b48073c85d3ca716480873aa3
v4_frozen_commit: ce79aa0b8f7444ac47ae9ae3ba6e72f997c5dd0a

immutability:
  protected_namespaces: [artifacts/v4, artifacts/v5, reports/v4, reports/v5]
  v5_final_checksum_manifest_sha256: 4a3fbef64ca760995365e2cda789a8f1491859d8d1b897bd25b803fc853f48c6
  v5_validation_report_sha256: 20659eaaa0742b05766d4035c87565b7df579bef490573bea0d4e7a972ab0d79
  permitted_operations: [read, validate, hash, import_common_code]
  forbidden_operations: [modify, delete, overwrite, relabel_result]

studies:
  student-mat: configs/v5_1/student_mat_v5_1.yaml
  student-por: configs/v5_1/student_por_v5_1.yaml
  oulad: configs/v5_1/oulad_v5_1.yaml

fixed_seeds: [42, 1201, 2026, 3407, 7319]
screening_seeds: [42, 2026, 3407]

selection:
  primary_metric: macro_f1
  configuration_scope: inner_validation_only
  outer_results_never_select_configuration: true
  best_seed_selection: PROHIBITED
  seed_or_fold_exclusion: PROHIBITED
  final_probability_ensemble: arithmetic_mean_all_five_fixed_seeds
  threshold_scope: inner_oof_only
  directional_targets_are_validator_gates: false
  multiple_testing_policy: one_primary_comparator_per_dataset

comparators:
  student-mat: {candidate: decision_tree, v5_macro_f1: 0.9018875313283208}
  student-por: {candidate: random_forest, v5_macro_f1: 0.8605087126041724}
  oulad: {candidate: xgboost, immutable_v4_v5_macro_f1: 0.8283814220}

desired_targets:
  student-mat_macro_f1: 0.89
  student-por_macro_f1: 0.86
  oulad_macro_f1: 0.832
  interpretation: directional_only

fit_scope:
  scaler: current_training_partition_only
  imputer: current_training_partition_only
  categorical_vocabulary: current_training_partition_only
  feature_selection: current_training_partition_only
  resampling: current_training_partition_only
  augmentation: current_training_partition_only
  self_supervised_pretraining: current_outer_training_partition_only

search:
  design: two_round
  round_a: one_component_group_at_a_time_against_anchor
  round_b: focused_search_only_over_components_retained_by_round_a
  sampler: optuna_tpe
  sampler_seed: 3407
  storage: persistent_sqlite_per_study
  pruner: median_after_warmup
  resume: true
  record_trial_metadata: true
  record_failure_reason: true
  record_gpu_memory: true
  plateau:
    meaningful_macro_f1_delta: 0.001
    consecutive_non_improving_trials_min: 15
    consecutive_non_improving_trials_max: 20
    stop_if_top_region_converged: true
    stop_if_gain_below_seed_noise: true
    stop_if_fold_configs_diverge_materially: true
    lucky_trial_hunting: PROHIBITED

training:
  optimizer: AdamW
  normalization: LayerNorm
  mixed_precision: true
  gradient_clipping: true
  schedulers: [cosine, reduce_on_plateau]
  early_stopping: true
  batch_size_must_fit: NVIDIA_RTX_2060_6GB
  monitored:
    - train_loss
    - validation_loss
    - macro_f1
    - per_class_recall
    - gradient_norm
    - learning_rate
    - gate_distribution
    - attention_entropy
    - best_epoch
    - gpu_peak_memory
    - runtime_seconds
    - parameter_count

final_evaluation:
  fixed_seeds: [42, 1201, 2026, 3407, 7319]
  all_outer_folds: true
  aligned_oof_predictions: true
  checkpoint_replay: required
  sha256: required
  paired_record_comparison: required
  bootstrap_unit:
    uci: student_record
    oulad: id_student_group
  bootstrap_replicates: 5000
  confidence_level: 0.95
  report_worst_fold_and_seed: true

future_lock:
  oulad_future_benchmark: LOCKED_NOT_EXECUTED
  post_cutoff_events: PROHIBITED
  auto_open_after_review: false
  required_decision_memo: OPEN_or_KEEP_LOCKED

artifacts:
  root: artifacts/v5_1
  reports: reports/v5_1
  configs: configs/v5_1
  code: src/studies/v5_1
  tests: tests/v5_1
  checksum: sha256
  cache_reuse_requires_matching_fingerprint: true
  run_state_required: true

database:
  model_training_scope: excluded
  existing_schema_redesign: prohibited
  metadata_registry_write: only_after_final_model_lock
  destructive_actions: disposable_database_only
  credentials_in_repository_or_artifacts: PROHIBITED

validation:
  correctness_not_superiority: true
  v4_validator_must_pass: true
  v5_validator_must_pass: true
  v4_v5_checksums_must_remain_unchanged: true
  v5_1_validator_must_pass: true
  future_oulad_must_remain_not_executed: true
  skip_requires_machine_readable_reason: true

amendment_policy:
  allowed_only_for_reproducible_technical_error: true
  amendment_file_required: true
  invalidate_affected_artifacts: true
  rerun_minimum_affected_scope: true

