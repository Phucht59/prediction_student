version: recommendation.a4_replacement.v1
prompt_version: recommendation_a4_replacement_v1
model: gemini-3.5-flash-lite
batch_size: 10
rate_limit_rpm: 12
actions:
  B1_PROGRESS_MONITORING:
    name: Progress Monitoring
    definition: Encourage the learner to review current progress, identify gaps, and monitor improvement over time.
  B2_ACADEMIC_HELP_SEEKING:
    name: Academic Help Seeking
    definition: Encourage appropriate academic assistance when current difficulties indicate support may be useful.
state_fields:
  - stage
  - risk_probability
  - risk_band
  - inactive_streak
  - active_days_ratio
  - recent_activity
  - activity_trend
  - assessment_completion
  - missing_assessments
  - course_progress
  - quiz_activity
  - vle_available
degeneracy_flag_threshold: 0.95
