rules:
  assessment_recovery:
    feasibility_required: FEASIBLE
    evidence:
    - missing_assessments
    - assessment_completion
    - course_progress
    direction: missing_assessments_high_completion_low
  re_engagement:
    feasibility_required: FEASIBLE
    vle_required: true
    evidence:
    - inactive_streak
    - active_days_ratio
    - recent_activity
    - activity_trend
    - vle_available
    direction: inactivity_high_activity_low_trend_negative
  study_planning:
    feasibility_required: FEASIBLE
    evidence:
    - active_days_ratio
    - recent_activity
    - activity_trend
    - course_progress
    - stage
    distinction_gate: participating_and_not_strongly_disengaged
    direction: conservative_pattern_organization
  progress_monitoring:
    feasibility_required: FEASIBLE
    evidence:
    - course_progress
    - stage
    - assessment_completion
    - missing_assessments
    - activity_trend
    progress_gap_formula: disabled_until_course_progress_semantics_are_observable
    direction: stage_consistent_progress_gap_only
  retrieval_practice:
    feasibility_required: FEASIBLE
    quiz_activity_zero: availability_unknown
    evidence:
    - quiz_activity
    direction: positive_quiz_evidence_relative_activity
