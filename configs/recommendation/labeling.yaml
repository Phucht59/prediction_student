version: recommendation_label_v1
schema_version: recommendation.labeling.v1
default_batch_size: 10
supported_batch_sizes: [1, 5, 10]
pilot_size: 30
seed: 2026
gemma:
  model: gemma-4-31b-it
  endpoint_env: GEMINI_BASE_URL
  default_endpoint: https://generativelanguage.googleapis.com/v1beta
  api_key_env: GEMINI_API_KEY
gemini:
  model: gemini-3.5-flash-lite
  api_key_env: GEMINI_API_KEY
  endpoint: https://generativelanguage.googleapis.com/v1beta
confidence:
  allowed: [LOW, MEDIUM, HIGH]
  auxiliary_only: true
robustness:
  repeat_experiment: gemini_repeat_v1
  prompt_variant: recommendation_label_v1b
  sample_size: 150
  seed: 2026
  main_lf_name: LF_GEMINI_MAIN
  not_independent_labeling_functions: true
feasibility_contract:
  INFEASIBLE_label: ABSTAIN
  INFEASIBLE_reason: INFEASIBLE
  numeric_zero_means: NOT_RELEVANT_only
