version: recommendation.weak_supervision.v5
phase6_source_manifest_version: recommendation.phase6_source_manifest.v1
source_manifest: artifacts/recommendation/labeling/phase6_source_manifest.json
phase7_input: configs/recommendation/phase7_input.yaml
label_model_version: recommendation.weak_supervision.v5
actions: [assessment_recovery, re_engagement, study_planning, progress_monitoring, retrieval_practice]
source_lfs: [LF_GEMINI35, LF_GEMMA4, LF_BEHAVIOR]
action_source_lfs:
  assessment_recovery: [LF_GEMINI35, LF_GEMMA4, LF_BEHAVIOR]
  re_engagement: [LF_GEMINI35, LF_GEMMA4, LF_BEHAVIOR]
  study_planning: [LF_GEMINI35, LF_GEMMA4, LF_BEHAVIOR]
  progress_monitoring: [LF_GEMINI35, LF_GEMINI31]
  retrieval_practice: [LF_GEMINI35, LF_GEMMA4, LF_BEHAVIOR]
abstain_value: -1
label_cardinality: 4
classes: [0, 1, 2, 3]
project_seeds: [42, 1201, 2026]
label_model_seeds: [42, 1201, 2026]
label_model:
  n_epochs: 100
  lr: 0.01
  l2: 0.0
  optimizer: sgd
  log_freq: 100
  mu_eps: 1.0e-8
stochasticity:
  same_seed_repeats: 2
  max_abs_deviation_threshold: 1.0e-6
  average_if_stochastic: true
a4:
  action_id: progress_monitoring
  correlated_family: true
  family: gemini
  allow_snorkel_if_usable: true
  fallback_aggregator: TWO_SOURCE_CONSENSUS
  collapse_hard_label_share: 0.95
  collapse_expected_relevance_std: 0.001
  unstable_seed_deviation: 0.05
a5:
  action_id: retrieval_practice
  remain_review_unless_strong_upgrade: true
  upgrade_min_quadratic_kappa: 0.40
  conflict_kappa_threshold: 0.20
gate:
  a4_candidate_action: progress_monitoring
  require_a4_gemini35_500_valid: true
  require_a4_gemini31_500_valid: true
  allow_a4_behavior_all_abstain: true
  a4_effective_lfs_if_behavior_abstains: [LF_GEMINI35, LF_GEMINI31]
  reject_a4_gemma_source: true
  reject_academic_help_seeking_source: true
  reject_panel_b: true
  reject_final_stage: true
  reject_retired_content_review: true
  reject_gemini_robustness: true
  reject_manual_reliability_weights: true
silver:
  keep_all_case_action_rows: true
  all_abstain_status: NO_WEAK_EVIDENCE
  do_not_map_abstain_to_zero: true
  probability_sum_atol: 1.0e-5
