version: recommendation.sampling.v1
seed: 2026
source: artifacts/recommendation/states/oulad_student_states.parquet
identity_unit: student_id_then_enrollment_identity
panel_a_target: 500
panel_b_target: 150
stages: [20pct, 35pct, 50pct, 75pct]
outer_folds: [0, 1, 2]
risk_bands:
  Low: "risk_probability < 0.33"
  Borderline: "0.33 <= risk_probability < 0.66"
  High: "risk_probability >= 0.66"
  meaning: sampling construct only; not a Hybrid prediction classification threshold
allocation: largest_remainder_over_36_stage_fold_risk_strata
panel_policy: assign unique student to one panel before selecting one stage-case
outputs:
  panel_a: artifacts/recommendation/panels/panel_a.parquet
  panel_b: artifacts/recommendation/panels/panel_b.parquet
  manifest: artifacts/recommendation/panels/panel_manifest.json
