version: recommendation.academic_help_seeking.v1
prompt_version: recommendation_academic_help_seeking_gemma_v1
model: gemma-4-31b-it
batch_size: 1
rate_limit_rpm: 27
pilot_size: 30
gate:
  degeneracy_max_share: 0.95
  minimum_exact_agreement: 0.50
  minimum_weighted_kappa: 0.20
  agreement_rule: exact_or_weighted_kappa
evidence_fields:
  - stage
  - risk_probability
  - inactive_streak
  - active_days_ratio
  - recent_activity
  - activity_trend
  - assessment_completion
  - missing_assessments
rejected_candidate:
  id: progress_monitoring
  status: REJECTED_NOT_ROBUST
