version: recommendation.student_state.v1
prediction:
  artifact: artifacts/prediction/final/predictions/predictions.parquet
  model_id: hybrid
  display_name: Hybrid
  dataset: oulad
  stages: [20pct, 35pct, 50pct, 75pct]
  final_stage_excluded: FINAL-100
  expected_seeds: [42, 1201, 2026]
risk:
  probability_source: frozen Hybrid score, mean over expected seeds
  uncertainty: unavailable_when_not_persisted
  risk_band:
    source: operational_recommendation_thresholds
    prediction_threshold: false
    low_max: 0.33
    medium_max: 0.66
features:
  source_contract: src.hybrid.phase7.data.build_oulad_phase7_view
  temporal_validity: strict event and assessment date < cutoff; registration-aware observed mask
  forbidden_predictors: [final_result, target, score, date_unregistration]
  missing_policy: omit semantic feature when no verified source exists; preserve valid zero observations
output:
  parquet: artifacts/recommendation/states/oulad_student_states.parquet
  preview_csv: reports/recommendation/oulad_student_states_preview.csv
