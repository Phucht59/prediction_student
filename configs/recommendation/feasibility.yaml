version: recommendation.feasibility.v1
action_taxonomy:
  A1: Assessment Recovery
  A2: Re-engagement
  A3: Study Planning
  A4: Content Review
  A5: Retrieval Practice
statuses: [FEASIBLE, INFEASIBLE, UNKNOWN]
rules:
  A1: missing_assessments == 0 -> INFEASIBLE with NO_MISSING_ASSESSMENTS_NOT_APPLICABLE; otherwise FEASIBLE
  A2: vle_available false -> INFEASIBLE; true -> FEASIBLE
  A3: no resource gate in current state -> FEASIBLE
  A4: content_available absent -> UNKNOWN
  A5: quiz_activity > 0 -> FEASIBLE; zero does not imply unavailable -> UNKNOWN
constraints:
  no_relevance_features: true
  no_invented_availability: true
  no_future_features: true
output: artifacts/recommendation/feasibility/oulad_action_feasibility.parquet
