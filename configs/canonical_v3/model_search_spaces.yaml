schema_version: canonical_v3_search_spaces_v1
status: FROZEN_BEFORE_BENCHMARK
architecture_search: false

oulad_final_tabular:
  logistic_regression:
    - {C: 0.1, class_weight: balanced}
    - {C: 1.0, class_weight: balanced}
    - {C: 10.0, class_weight: balanced}
  decision_tree:
    - {max_depth: 6, min_samples_leaf: 10, class_weight: balanced}
    - {max_depth: 12, min_samples_leaf: 5, class_weight: balanced}
    - {max_depth: null, min_samples_leaf: 10, class_weight: balanced}
  random_forest:
