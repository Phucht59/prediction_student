    - {n_estimators: 500, max_depth: 3, learning_rate: 0.03, subsample: 0.9, colsample_bytree: 0.9}
  mlp:
    - {hidden_layer_sizes: [128, 64], alpha: 0.0001, learning_rate_init: 0.001, max_iter: 300}
    - {hidden_layer_sizes: [96, 48], alpha: 0.001, learning_rate_init: 0.0005, max_iter: 300}

