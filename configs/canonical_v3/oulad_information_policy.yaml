schema_version: canonical_v3_oulad_information_policy_v1
authority_id: UNIFIED_CANONICAL_BENCHMARK_V3
status: FROZEN_BEFORE_BENCHMARK
policy: STRICT_REAL_TIME
decision_basis: temporal_defensibility_not_model_performance

score_policy:
  score_values: EXCLUDED
  reason: OULAD has assessment and submission dates but no explicit score-release timestamp
  allowed_assessment_information:
    - assessment metadata known by the cutoff
    - submission occurrence when date_submitted is before the cutoff
    - lateness derived from due date and submission date
  forbidden_assessment_information:
    - score value
    - score-derived aggregate
    - score-derived pretraining target

event_policy:
  first_allowed_day: 0
  cutoff_condition: event_day < cutoff_day
  future_events: EXCLUDED
  final_result: TARGET_ONLY
  date_unregistration: ELIGIBILITY_AND_AUXILIARY_ONLY

stages:
  E1_EARLY_20PCT: floor(module_presentation_length * 0.20)
  E2_EARLY_35PCT: floor(module_presentation_length * 0.35)
  M1_MIDDLE_50PCT: floor(module_presentation_length * 0.50)
  L1_LATE_75PCT: min(floor(module_presentation_length * 0.75), module_presentation_length - 14)
  FINAL: module_presentation_length - 14

eligibility:
  semantics: dynamic_registered_risk_set
  registered_by_cutoff: true
  known_unregistration_before_cutoff: excluded
  model_comparison_within_stage: identical cohort and folds
  cross_stage_common_cohort_diagnostic: required

limitation: >-
  Strict real-time availability is conservative because OULAD does not record
  when a marked score became visible to the student or prediction system.
