schema_version: unified_canonical_benchmark_v3
authority_id: UNIFIED_CANONICAL_BENCHMARK_V3
status: FROZEN_BEFORE_BENCHMARK
parent_authority_commit: 020e445d1e01a35ea2ad7343c7f781be156cbfa3
benchmark_label: CANONICAL_NESTED_CV_BENCHMARK
external_holdout_claim: false
historical_data_reuse_disclosed: true

primary_models:
  - logistic_regression
  - decision_tree
  - random_forest
  - hist_gradient_boosting
  - svm
  - xgboost
  - mlp
  - hybrid
ablations: [cnn_only, bilstm_only]

uci:
  datasets: [student_mat, student_por]
  target:
    classes: [Low, Medium, High]
    thresholds: {low_max: 9, medium_max: 13, high_min: 14}
    forbidden_predictor: G3
  stages:
    S0_EARLY_NO_GRADE: {G1: unavailable, G2: unavailable}
    S1_MID_G1_ONLY: {G1: available, G2: unavailable}
    S2_LATE_G1_G2: {G1: available, G2: available}
  main_task: dedicated_S2_information_checkpoint
  folds: 5
  inner_folds: 3
  seeds: [42, 1201, 2026, 3407, 7319]
  decision_rule: argmax
  hybrid:
    architecture_id: CNN_BILSTM_UCI_CANONICAL
    class: src.models._uci.UCICNNBiLSTM
    temporal_steps: 2
    temporal_features: 7
    topology:
      input_projection: 16
      cnn_channels: 16
      cnn_kernels: [1, 2]
      lstm_hidden: 16
      lstm_layers: 1
      bidirectional: true
      context_hidden: 16
      context_layers: 1
      fusion_hidden: 16
      fusion: gated
      activation: gelu
    training:
      learning_rate: 0.001
      weight_decay: 0.0001
      dropout: 0.15
      batch_size: 64
      max_epochs: 30
      patience: 5
      class_weight: balanced
  replay:
    main_ml: exact_frozen_predictions_when_fold_and_feature_hashes_match
    stages_all_models: exact_unified_stage_aware_uci_v1_predictions
    main_hybrid: retrain_dedicated_checkpoint_with_frozen_topology

oulad:
  target:
    positive: [Withdrawn, Fail]
    negative: [Pass, Distinction]
  information_policy: configs/canonical_v3/oulad_information_policy.yaml
  stages: [E1_EARLY_20PCT, E2_EARLY_35PCT, M1_MIDDLE_50PCT, L1_LATE_75PCT, FINAL]
  folds: 3
  inner_folds: 2
  seeds: [42, 1201, 2026, 3407, 7319]
  threshold:
    source: pooled_inner_oof_only
    objective: maximize_macro_f1
    diagnostic_fixed_threshold: 0.5
  hybrid:
    architecture_id: H1_TABULAR_RESIDUAL_EXPERT
    class: src.models.oulad_tabular_residual.CNNBiLSTMTabularResidualOULAD
    architecture_hash: df5cd885b96e5cea4b840bfc5ca59c08c095f5887df8dd8dcef738edfe8bf70e
    temporal_backbone_hash: 367b30a4f4cbc58ef380d2735fb1e8ff0efafcac1172db7b3695f4a0bdedcf46
    parameter_count: 160492
    topology_frozen: true
    max_epochs: 15
    checkpoint_criterion: minimum_mean_stage_validation_nll_for_shared_or_minimum_final_validation_nll_for_endpoint
    epoch_aggregation: round_half_up_median
    training_configs_source: artifacts/audit/phase3/selected_configs.json
  checkpoints:
    shared_stage: one_checkpoint_per_outer_fold_seed_for_all_five_stages
    endpoint: dedicated_FINAL_checkpoint_same_architecture
  replay:
    old_stage_ml: allowed_only_after_exact_policy_fold_schema_validation
    old_h1: historical_diagnostic_only
    final: no_compatible_prediction_exists_retrain_required

metrics:
  common:
    - accuracy
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - macro_f1
    - weighted_precision
    - weighted_recall
    - weighted_f1
    - pr_auc
    - roc_auc
    - nll
    - brier
    - ece
  uci_per_class: [precision, recall, f1, support]
  oulad_binary:
    - risk_precision
    - risk_recall
    - risk_f1
    - not_risk_precision
    - not_risk_recall
    - not_risk_f1
    - specificity
    - tp
    - fp
    - tn
    - fn

selection:
  outer_labels_used: false
  best_seed_selection: false
  primary_metric: macro_f1
  secondary_metrics: [pr_auc, roc_auc, balanced_accuracy, nll, brier, ece]
  post_result_tuning: prohibited
  architecture_search: prohibited

statistics:
  paired_bootstrap_replicates: 5000
  confidence: 0.95
  seed: 7319
