status: PREREGISTERED_BEFORE_UNIFIED_OUTER_SCORING
study_id: unified_stage_aware_oulad_v1
dataset: oulad
target:
  at_risk: [Withdrawn, Fail]
  not_at_risk: [Pass, Distinction]
stages:
  E1_EARLY_20PCT: {target_progress_fraction: 0.20, cutoff_rule: floor(length * 0.20)}
  E2_EARLY_35PCT: {target_progress_fraction: 0.35, cutoff_rule: floor(length * 0.35)}
  M1_MIDDLE_FROZEN: {target_progress_fraction: 0.50, cutoff_rule: exact_legacy_F2_MIDDLE}
  L1_LATE_75PCT: {target_progress_fraction: 0.75, cutoff_rule: floor(length * 0.75), outcome_guard_days: 14}
training:
  outer_folds: 3
  inner_folds: 2
  fixed_seeds: [42, 1201, 2026, 3407, 7319]
  outer_used_for_tuning: false
  best_seed_selection: false
  transfer_learning: prohibited
  pretrained_checkpoint: prohibited
  synthetic_resampling: prohibited
  deep:
    max_epochs: 4
    patience: 2
    batch_size: 256
    learning_rate: 0.0005
    weight_decay: 0.00001
    dropout: 0.20
    survival_weight: 0.15
    outcome_weight: 0.15
    configs:
      - {id: frozen_default, learning_rate: 0.0005, weight_decay: 0.00001, dropout: 0.20, batch_size: 256}
  svm_runtime_amendment:
    amendment_id: svm_runtime_protocol_amendment_v1
    model_family: sklearn.svm.SVC
    kernel: rbf
    C: 1.0
    gamma: scale
    probability: false
    class_weight: balanced
    cache_size_mb: 4096
    shrinking: true
    tol: 0.001
    max_iter: -1
    calibration: pooled_inner_oof_platt_logistic_regression
    calibration_uses_outer_labels: false
    threshold_selection_uses_outer_labels: false
models:
  - logistic_regression
  - decision_tree
  - random_forest
  - hist_gradient_boosting
  - svm
  - xgboost
  - mlp
  - cnn_only
  - bilstm_only
  - cnn_bilstm
feature_contract:
  temporal_channels: 47
  temporal_base_channels: 16
  aggregate_base_features: 161
  static_features: [code_module, presentation_season, num_of_prev_attempts, studied_credits, registration_lead_time, module_presentation_length]
  stage_context: [progress_fraction, observed_week_count, weeks_remaining, assessment_available_fraction]
  forbidden_predictors: [final_result, date_unregistration, code_presentation]
threshold_policies: [FIXED_0_5, INNER_OOF_STAGE_THRESHOLD]
bootstrap:
  replicates: 5000
  grouped_by: id_student
