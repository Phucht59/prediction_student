schema_version: final_comparator_completion_protocol_v1
protocol_id: final-comparator-completion-20260723-v1
status: PREREGISTERED_BEFORE_COMPARATOR_TRAINING
registered_at: "2026-07-23T00:00:00+07:00"
starting_commit: f702aea20e0df5d8c23cc0f637c31b83c7c58748
purpose: complete_applicable_metrics_for_fixed_nine_model_comparator_matrix

immutable_release_contract:
  official_deep_models_retrained: false
  official_checkpoint_selection_changed: false
  official_thresholds_changed: false
  recommendation_system_changed: false
  selected_model_registry_changed: false
  future_oulad:
    status: LOCKED_NOT_EXECUTED
    labels_read: false
    inference_executed: false
  integrated_system_verdict: INTEGRATED_SYSTEM_PASS_EXPERT_PENDING

models:
  ordered:
    - cnn_bilstm
    - cnn_only
    - bilstm_only
    - logistic_regression
    - decision_tree
    - random_forest
    - hist_gradient_boosting
    - svm
    - xgboost
  training_allowed:
    student_mat: [xgboost]
    student_por: [xgboost]
    oulad:
      - logistic_regression
      - decision_tree
      - random_forest
      - hist_gradient_boosting
      - svm
      - xgboost

common:
  fixed_seeds: [42, 1201, 2026, 3407, 7319]
  selection_seed: 3407
  primary_inner_metric: macro_f1
  preprocessing_scope: current_inner_or_outer_training_partition_only
  model_selection_scope: inner_cv_only
  outer_validation_role: oof_prediction_only
  seed_selection: prohibited
  probability_ensemble: arithmetic_mean_across_all_fixed_seeds_per_record
  missing_values:
    numeric_imputation: median_fit_on_current_training_partition
    categorical_imputation: most_frequent_fit_on_current_training_partition
    unknown_categories: ignore_with_all_zero_onehot
  failure_policy:
    retry_same_registered_configuration: allowed
    resume_passed_fold_by_checksum: required
    alter_search_space_after_results: prohibited_without_preregistered_amendment
    omit_slow_model: prohibited
    applicable_na_in_final_release: prohibited
  resource_policy:
    cpu_only_comparators: true
    random_forest_n_jobs: 3
    xgboost_n_jobs: 3
    concurrent_rbf_svm_jobs: 1
    data_subsampling: prohibited
    persist_after_each_outer_fold: true
  metric_definitions:
    accuracy: sklearn_accuracy_score
    balanced_accuracy: sklearn_balanced_accuracy_score
    macro_precision: sklearn_precision_score_average_macro_zero_division_0
    macro_recall: sklearn_recall_score_average_macro_zero_division_0
    macro_f1: sklearn_f1_score_average_macro_zero_division_0
    weighted_f1: sklearn_f1_score_average_weighted_zero_division_0
    pr_auc: average_precision_from_native_probability
    roc_auc: roc_auc_from_native_probability
    brier: mean_sum_squared_probability_error
    nll: sklearn_log_loss_with_fixed_class_order
    ece: ten_equal_width_confidence_bins
  artifact_schema:
    prediction_key: [dataset, model_id, record_id, seed]
    required_columns:
      - dataset
      - model_id
      - record_id
      - true_label
      - predicted_label
      - outer_fold
      - inner_protocol_id
      - seed
      - config_hash
      - split_manifest_hash
      - feature_contract_hash
      - run_id
    binary_extra_columns: [p_not_at_risk, p_at_risk, threshold]
    multiclass_extra_columns: [p_low, p_medium, p_high]
    probability_tolerance: 1.0e-6

datasets:
  student_mat:
    dataset_id: student_mat
    source: data/raw/student-mat.csv
    source_sha256: e47f9ee225e1ee6e69b7564e6dac7123e80b8486677fe111f351964cef5dec80
    expected_records: 395
    target:
      source_column: G3
      class_order: [Low, Medium, High]
      mapping: {Low: [0, 9], Medium: [10, 14], High: [15, 20]}
      G3_as_input: prohibited
    feature_contract:
      id: UCI_V5_1_SAFE_TEMPORAL_CONTEXT
      temporal_source: [G1, G2]
      context:
        - failures
        - studytime
        - schoolsup
        - famsup
        - paid
        - activities
        - internet
        - higher
        - traveltime
        - freetime
        - goout
        - health
      implementation: src/studies/v5_1/common/uci_data.py
    split:
      manifest: artifacts/v5/student_mat/split_manifest.csv
      sha256: 3b1dbfc8e359f415e70e1e607a0f14b44d26bfc1bd0616650d0c2346509171f5
      outer_folds: 5
      inner_folds: 3
      inner_method: StratifiedGroupKFold
      split_seed: 42
    xgboost:
      model_id: xgboost_mat
      objective: multi:softprob
      search_budget_per_outer_fold: 12
      sampler: deterministic_parameter_sampler
      search_space:
        n_estimators: [120, 200, 320]
        max_depth: [2, 3, 4, 5]
        learning_rate: [0.025, 0.05, 0.1]
        min_child_weight: [1, 3, 6]
        subsample: [0.7, 0.85, 1.0]
        colsample_bytree: [0.7, 0.85, 1.0]
        gamma: [0.0, 0.1, 0.3]
        reg_alpha: [0.0, 0.01, 0.1]
        reg_lambda: [0.5, 1.0, 2.0, 5.0]
      tie_break:
        - macro_f1_desc
        - balanced_accuracy_desc
        - macro_pr_auc_desc
        - brier_asc
        - n_estimators_asc

  student_por:
    dataset_id: student_por
    source: data/raw/student-por.csv
    source_sha256: a7594a11d7771c0efe1a740824e0e833da9c4cad07c39a9766a874575563fb3f
    expected_records: 649
    target:
      source_column: G3
      class_order: [Low, Medium, High]
      mapping: {Low: [0, 9], Medium: [10, 14], High: [15, 20]}
      G3_as_input: prohibited
    feature_contract:
      id: UCI_V5_1_SAFE_TEMPORAL_CONTEXT
      temporal_source: [G1, G2]
      context:
        - failures
        - studytime
        - schoolsup
        - famsup
        - paid
        - activities
        - internet
        - higher
        - traveltime
        - freetime
        - goout
        - health
      implementation: src/studies/v5_1/common/uci_data.py
    split:
      manifest: artifacts/v5/student_por/split_manifest.csv
      sha256: 2ea07b2d17714fc9df3eec23150579090d245a1a45f33270b2864c88653d2de2
      outer_folds: 5
      inner_folds: 3
      inner_method: StratifiedGroupKFold
      split_seed: 1201
    xgboost:
      model_id: xgboost_por
      objective: multi:softprob
      search_budget_per_outer_fold: 12
      sampler: deterministic_parameter_sampler
      search_space:
        n_estimators: [120, 200, 320]
        max_depth: [2, 3, 4, 5]
        learning_rate: [0.025, 0.05, 0.1]
        min_child_weight: [1, 3, 6]
        subsample: [0.7, 0.85, 1.0]
        colsample_bytree: [0.7, 0.85, 1.0]
        gamma: [0.0, 0.1, 0.3]
        reg_alpha: [0.0, 0.01, 0.1]
        reg_lambda: [0.5, 1.0, 2.0, 5.0]
      tie_break:
        - macro_f1_desc
        - balanced_accuracy_desc
        - macro_pr_auc_desc
        - brier_asc
        - n_estimators_asc

  oulad:
    dataset_id: oulad
    forecast: F2_MIDDLE
    expected_records: 15378
    cohort_role: historical_development
    target:
      name: target_at_risk
      class_order: [Not-at-risk, At-risk]
      positive_class: At-risk
    identity: [code_module, code_presentation, id_student]
    group_key: id_student
    feature_contract:
      id: UNIFIED_OULAD_ML_FEATURE_CONTRACT_V1
      inputs: [compact_aggregate, static]
      sequence_excluded_from_ml_comparators: true
      implementation: src/studies/v5_1/oulad/data.py
      compact_selection: deterministic_COMPACT_SUMMARIES_allowlist
      static:
        - code_module
        - presentation_season
        - num_of_prev_attempts
        - studied_credits
        - registration_lead_time
        - module_presentation_length
    sources:
      processed_manifest:
        path: data/processed/study_c_oulad/manifests/F2_MIDDLE.json
        sha256: 8482dbf51c1fe25940a8eef871daeaf07515ac9698fc36b5620263d52b9a1110
      aggregate:
        path: data/processed/study_c_oulad/aggregated/F2_MIDDLE.parquet
        sha256: 3e935a12da9625048b6dd3b237fac9791a7e5ef601d315aa4184f40111d4efe0
      target:
        path: data/processed/study_c_oulad/targets/F2_MIDDLE.parquet
        sha256: f5dabf9719c2c8ce038e2bca89d11da82508eee2ca65c92c2bca40d7bad9da80
    split:
      manifest: artifacts/v5/oulad/split_manifest.csv
      sha256: ae8d20773ccfda9123a9ef5e7162f0a324f80edd8dcb152ae2c97f1b6814cbb0
      outer_folds: 3
      inner_folds: 3
      group_disjoint_on: id_student
      inner_seed: 3407
    threshold:
      scope: pooled_inner_oof_ensemble_for_each_outer_fold
      candidate_grid: unique_probabilities_and_midpoints
      objective: macro_f1
      tie_break: [risk_recall_desc, risk_precision_desc, threshold_nearest_0_5]
      outer_or_future_labels_used: false
    search:
      sampler: deterministic_parameter_sampler
      budget_per_model_per_outer_fold:
        logistic_regression: 6
        decision_tree: 8
        random_forest: 6
        hist_gradient_boosting: 6
        svm: 6
        xgboost: 6
      spaces:
        logistic_regression:
          C: [0.05, 0.2, 1.0, 5.0, 20.0]
          class_weight: [null, balanced]
          solver: [lbfgs]
          max_iter: [4000]
        decision_tree:
          criterion: [gini, entropy, log_loss]
          max_depth: [4, 8, 12, 20, null]
          min_samples_split: [2, 10, 30]
          min_samples_leaf: [1, 5, 20, 50]
          max_features: [null, sqrt, log2]
          class_weight: [null, balanced]
          ccp_alpha: [0.0, 0.0001, 0.001, 0.01]
        random_forest:
          n_estimators: [200, 400, 700]
          max_depth: [8, 16, 24, null]
          min_samples_split: [2, 10, 30]
          min_samples_leaf: [1, 5, 20]
          max_features: [sqrt, log2, 0.5]
          bootstrap: [true, false]
          class_weight: [null, balanced, balanced_subsample]
        hist_gradient_boosting:
          learning_rate: [0.025, 0.05, 0.1]
          max_iter: [120, 220, 350]
          max_leaf_nodes: [15, 31, 63]
          max_depth: [null, 6, 10]
          min_samples_leaf: [10, 20, 50]
          l2_regularization: [0.0, 0.1, 1.0, 5.0]
          class_weight: [null, balanced]
        svm:
          kernel: [rbf]
          probability: [true]
          C: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
          gamma: [scale, auto, 0.001, 0.01, 0.1]
          class_weight: [null, balanced]
        xgboost:
          objective: [binary:logistic]
          tree_method: [hist]
          n_estimators: [150, 300, 500]
          max_depth: [2, 3, 5, 7]
          learning_rate: [0.025, 0.05, 0.1]
          min_child_weight: [1, 3, 8]
          subsample: [0.7, 0.85, 1.0]
          colsample_bytree: [0.7, 0.85, 1.0]
          gamma: [0.0, 0.1, 0.5]
          reg_alpha: [0.0, 0.01, 0.1]
          reg_lambda: [0.5, 1.0, 3.0, 8.0]
          scale_pos_weight: [1.0, balanced_training_partition]

evaluation:
  uci_bootstrap:
    unit: record
    paired: true
    resamples: 5000
    confidence: 0.95
    random_seed: 7319
  oulad_bootstrap:
    unit: id_student
    paired: true
    resamples: 5000
    confidence: 0.95
    random_seed: 7319
  practical_margin_macro_f1: 0.005
  allowed_comparison_verdicts:
    - CNN_BILSTM_HIGHER
    - COMPARATOR_HIGHER
    - PRACTICAL_TIE
  top_k:
    budgets: [0.05, 0.10, 0.20]
    rounding: ceiling
    sort: [p_at_risk_desc, record_id_asc]
    ndcg_gain: binary_true_label

