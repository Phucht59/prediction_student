schema_version: final_mlp_comparator_v1
status: PREREGISTERED_BEFORE_OUTER_SCORING
model_id: mlp
display_name: MLP
role: standalone_tabular_comparator
selected_model_replacement: false
datasets:
  student_mat:
    feature_contract: UCI_S2_LATE_G1_G2
    split_contract: frozen_final_5_outer_folds
