schema_version: recommend_scientific_labeling_phase1_v1
method: PROGRAMMATIC_WEAK_SUPERVISION_SNORKEL
unit_of_labeling: student_state_x_candidate_action
labels:
  INAPPROPRIATE: 0
  CONDITIONAL: 1
  APPROPRIATE: 2
lf_abstain: -1
ranking_relevance_grades:
  INAPPROPRIATE: 0
  CONDITIONAL: 1
  APPROPRIATE: 2
thresholds:
  status: PROVISIONAL_NOT_TUNED
  confidence: null
  minimum_coverage: null
datasets:
  student_mat: {stages: [S0, S1, S2], outcome_only_fields: [G3]}
  student_por: {stages: [S0, S1, S2], outcome_only_fields: [G3]}
  oulad:
    intervention_stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    evaluation_only_stages: [FINAL_EVALUATION]
    minimum_requested_cutoff: 20
    maximum_intervention_cutoff: 99
    anchor_policy: nearest_validated_anchor_not_after_request
required_prediction_authorities:
  student_mat: {model_id: cnn_bilstm_mat, authority: FINAL_THESIS_MODEL_AUTHORITY}
  student_por: {model_id: cnn_bilstm_por, authority: FINAL_THESIS_MODEL_AUTHORITY}
  oulad: {model_id: h1_tabular_residual_oulad, authority: RECOMMEND_HYBRID_MODEL_AUTHORITY}
prohibited_fields:
  - G3
  - age_band
  - disability
  - gender
  - region
  - imd_band
  - final_result
  - target
  - outer_label
  - date_unregistration
  - post_cutoff_event
split_policy:
  grouping_key: student_key
  all_stages_same_split: true
  student_overlap_between_splits: prohibited
  test_timing: after_protocol_and_threshold_lock
source_registry_path: artifacts/recommend_hybrid/scientific_labeling/source_registry.yaml
action_evidence_map_path: artifacts/recommend_hybrid/scientific_labeling/action_evidence_map.yaml
seed: 2026
