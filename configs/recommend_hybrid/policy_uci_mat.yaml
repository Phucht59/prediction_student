schema_version: recommend_hybrid_uci_policy_v1
policy_version: recommend_hybrid_uci_mat_policy_v1
dataset_id: student_mat
valid_stages: [S0, S1, S2]
forbidden_features: [G3, final_outcome, test_label, outer_label]
allowed_actions:
  - STUDY_SCHEDULE
  - ATTENDANCE_IMPROVEMENT
  - TARGETED_REVISION
  - PRACTICE_EXERCISES
  - ASSESSMENT_PREPARATION
  - INSTRUCTOR_CONTACT
  - ADVISOR_SUPPORT
  - PROGRESS_MONITORING
  - LEARNING_CONSOLIDATION
at_risk_prediction_classes: [0]
risk_probability_index: 0
risk_probability_priority_threshold: 0.60
stage_priority_caps: {S0: MEDIUM, S1: HIGH, S2: CRITICAL}
core_evidence:
  S0: [absences, study_time, previous_failures]
  S1: [absences, study_time, previous_failures, G1]
  S2: [absences, study_time, previous_failures, G1, G2]
contradiction_rules: []
severity_rules:
  absences:
    default: LOW
    rules:
      - {operator: ge, value: 20, severity: CRITICAL}
      - {operator: ge, value: 12, severity: HIGH}
      - {operator: ge, value: 6, severity: MEDIUM}
  study_time:
    default: LOW
    rules:
      - {operator: le, value: 1, severity: HIGH}
      - {operator: le, value: 2, severity: MEDIUM}
  previous_failures:
    default: LOW
    rules:
      - {operator: ge, value: 2, severity: CRITICAL}
      - {operator: ge, value: 1, severity: HIGH}
  G1:
    default: LOW
    rules:
      - {operator: lt, value: 6, severity: CRITICAL}
      - {operator: lt, value: 10, severity: HIGH}
      - {operator: lt, value: 12, severity: MEDIUM}
  G2:
    default: LOW
    rules:
      - {operator: lt, value: 6, severity: CRITICAL}
      - {operator: lt, value: 10, severity: HIGH}
      - {operator: lt, value: 12, severity: MEDIUM}
  grade_decline:
    default: NONE
    rules:
      - {operator: ge, value: 5, severity: CRITICAL}
      - {operator: ge, value: 3, severity: HIGH}
      - {operator: ge, value: 1, severity: MEDIUM}
  grade_improvement:
    default: NONE
    rules:
      - {operator: ge, value: 1, severity: LOW}
  next_assessment_available:
    default: NONE
    rules:
      - {operator: eq, value: true, severity: LOW}
actions:
  STUDY_SCHEDULE:
    stages: [S0, S1, S2]
    trigger_any: [{feature: study_time, minimum_severity: MEDIUM}]
    reason_codes: [LOW_STUDY_TIME_OBSERVED]
  ATTENDANCE_IMPROVEMENT:
    stages: [S0, S1, S2]
    trigger_any: [{feature: absences, minimum_severity: MEDIUM}]
    reason_codes: [ELEVATED_ABSENCES_OBSERVED]
  TARGETED_REVISION:
    stages: [S1, S2]
    trigger_any:
      - {feature: G1, minimum_severity: MEDIUM}
      - {feature: G2, minimum_severity: MEDIUM}
      - {feature: grade_decline, minimum_severity: MEDIUM}
    reason_codes: [LOW_OR_DECLINING_GRADE_EVIDENCE]
  PRACTICE_EXERCISES:
    stages: [S1, S2]
    trigger_any:
      - {feature: G1, minimum_severity: MEDIUM}
      - {feature: G2, minimum_severity: MEDIUM}
    reason_codes: [GRADE_EVIDENCE_SUPPORTS_PRACTICE]
  ASSESSMENT_PREPARATION:
    stages: [S1, S2]
    trigger_all:
      - {feature: next_assessment_available, minimum_severity: LOW}
    trigger_any:
      - {feature: G1, minimum_severity: MEDIUM}
      - {feature: G2, minimum_severity: MEDIUM}
    reason_codes: [LOW_GRADE_AND_FUTURE_ASSESSMENT_OBSERVED]
  INSTRUCTOR_CONTACT:
    stages: [S1, S2]
    trigger_any:
      - {feature: G1, minimum_severity: HIGH}
      - {feature: G2, minimum_severity: HIGH}
      - {feature: grade_decline, minimum_severity: HIGH}
    requires_human_contact: true
    reason_codes: [SEVERE_ACADEMIC_EVIDENCE_REQUIRES_CONTACT]
  ADVISOR_SUPPORT:
    stages: [S0, S1, S2]
    trigger_any:
      - {feature: previous_failures, minimum_severity: CRITICAL}
      - {feature: absences, minimum_severity: CRITICAL}
      - {feature: G1, minimum_severity: CRITICAL}
      - {feature: G2, minimum_severity: CRITICAL}
    requires_human_contact: true
    reason_codes: [CRITICAL_DIRECT_EVIDENCE_REQUIRES_ADVISOR]
  PROGRESS_MONITORING:
    stages: [S0, S1, S2]
    trigger_any:
      - {feature: absences, minimum_severity: LOW}
      - {feature: study_time, minimum_severity: LOW}
      - {feature: G1, minimum_severity: LOW}
      - {feature: G2, minimum_severity: LOW}
    priority_cap: LOW
    reason_codes: [OBSERVED_ACADEMIC_INDICATOR_AVAILABLE]
  LEARNING_CONSOLIDATION:
    stages: [S2]
    trigger_any: [{feature: grade_improvement, minimum_severity: LOW}]
    priority_cap: LOW
    reason_codes: [IMPROVING_GRADE_TREND_OBSERVED]
provenance:
  threshold_basis: direct_UCI_variable_domains_and_predeclared_educational_policy
  risk_probability_threshold_basis: predeclared_context_band_not_action_suitability_probability
  test_labels_used: false
  outer_labels_used: false
  distribution_mixed_with_por: false
  source_policy: configs/canonical_v3/benchmark_protocol.yaml
  source_policy_sha256: 1f336c3cf1b799c25cd3fd075ed79a0e5770108b367940eead2326017bacad0c
