schema_version: recommend_hybrid_oulad_policy_v1
policy_version: recommend_hybrid_oulad_policy_v1
dataset_id: oulad
valid_stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75, FINAL_EVALUATION]
validated_anchors:
  - {stage: EARLY_20, cutoff_percent: 20, intervention: true}
  - {stage: EARLY_35, cutoff_percent: 35, intervention: true}
  - {stage: MIDDLE_50, cutoff_percent: 50, intervention: true}
  - {stage: LATE_75, cutoff_percent: 75, intervention: true}
  - {stage: FINAL_EVALUATION, cutoff_percent: 100, intervention: false}
cutoff_domain: {minimum: 0, maximum: 100, unit: percent}
forbidden_features: [final_result, date_unregistration, post_cutoff_event, score_without_release_time, test_label, outer_label]
allowed_actions:
  - VLE_ENGAGEMENT
  - ASSESSMENT_COMPLETION
  - TARGETED_PRACTICE
  - DIAGNOSTIC_CHECK
  - RETRIEVAL_PRACTICE
  - STUDY_SCHEDULE
  - INSTRUCTOR_CONTACT
  - ADVISOR_ESCALATION
  - PROGRESS_MONITORING
  - LEARNING_CONSOLIDATION
at_risk_prediction_classes: [1]
risk_probability_index: 1
risk_probability_priority_threshold: 0.60
stage_priority_caps: {EARLY_20: MEDIUM, EARLY_35: HIGH, MIDDLE_50: CRITICAL, LATE_75: CRITICAL}
core_evidence:
  EARLY_20: [course_progress, activity_level, inactivity_streak]
  EARLY_35: [course_progress, activity_level, inactivity_streak, assessment_progress]
  MIDDLE_50: [course_progress, activity_level, inactivity_streak, assessment_progress]
  LATE_75: [course_progress, activity_level, inactivity_streak, assessment_progress]
contradiction_rules:
  - reason_code: ACTIVITY_INACTIVITY_EVIDENCE_CONFLICT
    conditions:
      - {feature: activity_level, operator: gt, value: 10}
      - {feature: inactivity_streak, operator: ge, value: 14}
severity_rules:
  activity_level:
    default: LOW
    rules:
      - {operator: le, value: 2, severity: CRITICAL}
      - {operator: le, value: 5, severity: HIGH}
      - {operator: le, value: 10, severity: MEDIUM}
  recent_activity_trend:
    default: NONE
    rules:
      - {operator: le, value: -10, severity: CRITICAL}
      - {operator: le, value: -5, severity: HIGH}
      - {operator: lt, value: 0, severity: MEDIUM}
  inactivity_streak:
    default: LOW
    rules:
      - {operator: ge, value: 28, severity: CRITICAL}
      - {operator: ge, value: 14, severity: HIGH}
      - {operator: ge, value: 7, severity: MEDIUM}
  assessment_progress:
    default: LOW
    rules:
      - {operator: lt, value: 0.25, severity: CRITICAL}
      - {operator: lt, value: 0.50, severity: HIGH}
      - {operator: lt, value: 0.75, severity: MEDIUM}
  assessments_due:
    default: NONE
    rules:
      - {operator: gt, value: 0, severity: LOW}
  course_progress:
    default: LOW
    rules: []
  grade_trend:
    default: NONE
    rules:
      - {operator: le, value: -20, severity: CRITICAL}
      - {operator: le, value: -10, severity: HIGH}
      - {operator: lt, value: 0, severity: MEDIUM}
  knowledge_gap:
    default: NONE
    rules:
      - {operator: present, value: true, severity: HIGH}
actions:
  VLE_ENGAGEMENT:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: activity_level, minimum_severity: MEDIUM}
      - {feature: recent_activity_trend, minimum_severity: MEDIUM}
      - {feature: inactivity_streak, minimum_severity: MEDIUM}
    reason_codes: [LOW_OR_DECLINING_VLE_ENGAGEMENT]
  ASSESSMENT_COMPLETION:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_all:
      - {feature: assessments_due, minimum_severity: LOW}
      - {feature: assessment_progress, minimum_severity: MEDIUM}
    reason_codes: [INCOMPLETE_DUE_ASSESSMENTS_OBSERVED]
  TARGETED_PRACTICE:
    stages: [EARLY_35, MIDDLE_50, LATE_75]
    trigger_any: [{feature: knowledge_gap, minimum_severity: HIGH}]
    reason_codes: [OBSERVED_KNOWLEDGE_GAP]
  DIAGNOSTIC_CHECK:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: assessment_progress, minimum_severity: HIGH}
      - {feature: grade_trend, minimum_severity: HIGH}
    reason_codes: [SEVERE_ASSESSMENT_EVIDENCE_NEEDS_DIAGNOSIS]
  RETRIEVAL_PRACTICE:
    stages: [EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: assessment_progress, minimum_severity: MEDIUM}
      - {feature: grade_trend, minimum_severity: MEDIUM}
    reason_codes: [ASSESSMENT_EVIDENCE_SUPPORTS_RETRIEVAL]
  STUDY_SCHEDULE:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: inactivity_streak, minimum_severity: MEDIUM}
      - {feature: recent_activity_trend, minimum_severity: MEDIUM}
    reason_codes: [ACTIVITY_PATTERN_SUPPORTS_SCHEDULING]
  INSTRUCTOR_CONTACT:
    stages: [EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: assessment_progress, minimum_severity: HIGH}
      - {feature: grade_trend, minimum_severity: HIGH}
    requires_human_contact: true
    reason_codes: [SEVERE_ASSESSMENT_EVIDENCE_REQUIRES_CONTACT]
  ADVISOR_ESCALATION:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: inactivity_streak, minimum_severity: CRITICAL}
      - {feature: assessment_progress, minimum_severity: CRITICAL}
      - {feature: grade_trend, minimum_severity: CRITICAL}
    requires_human_contact: true
    reason_codes: [CRITICAL_DIRECT_EVIDENCE_REQUIRES_ADVISOR]
  PROGRESS_MONITORING:
    stages: [EARLY_20, EARLY_35, MIDDLE_50, LATE_75]
    trigger_any:
      - {feature: activity_level, minimum_severity: LOW}
      - {feature: assessment_progress, minimum_severity: LOW}
    priority_cap: LOW
    reason_codes: [OBSERVED_LEARNING_INDICATOR_AVAILABLE]
  LEARNING_CONSOLIDATION:
    stages: [MIDDLE_50, LATE_75]
    trigger_all:
      - {feature: assessment_progress, minimum_severity: LOW, maximum_severity: LOW}
      - {feature: activity_level, minimum_severity: LOW, maximum_severity: LOW}
    priority_cap: LOW
    reason_codes: [STABLE_PROGRESS_SUPPORTS_CONSOLIDATION]
provenance:
  threshold_basis: direct_feature_semantics_and_predeclared_operational_bands
  risk_probability_threshold_basis: predeclared_context_band_not_action_suitability_probability
  test_labels_used: false
  outer_labels_used: false
  source_information_policy: configs/canonical_v3/oulad_information_policy.yaml
  source_information_policy_sha256: 47842af0ab7da35b8bc6adb99291b56a4e3dac57a7518525171f9c4f7dcf4b6d
