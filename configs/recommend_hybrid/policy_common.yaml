schema_version: recommend_hybrid_policy_common_v1
policy_version: recommend_hybrid_evidence_policy_v1
policy_type: EVIDENCE_BASED_KNOWLEDGE_RECOMMENDATION_POLICY
prediction_authority: RECOMMEND_HYBRID_MODEL_AUTHORITY
prediction_backbone: FROZEN_HYBRID_CNN_BILSTM
neural_ranker_enabled: false
recommendation_training_required: false
expert_label_dependency: false
embedding_decision_use: prohibited
priority_order: [NOT_APPLICABLE, LOW, MEDIUM, HIGH, CRITICAL]
priority_from_severity:
  NONE: NOT_APPLICABLE
  LOW: LOW
  MEDIUM: MEDIUM
  HIGH: HIGH
  CRITICAL: CRITICAL
risk_context:
  direct_evidence_required: true
  maximum_priority_steps: 1
  probability_role: contextual_priority_modifier_after_direct_evidence
uncertainty:
  predictive_entropy:
    caution_at: 0.55
    abstain_at: 0.68
    provenance: predeclared_binary_entropy_operating_bands_before_phase3_scenarios
  seed_disagreement:
    caution_at: 0.08
    abstain_at: 0.15
    provenance: predeclared_five_seed_probability_dispersion_bands_before_phase3_scenarios
  caution_priority_cap: MEDIUM
  behavior: uncertainty_never_increases_priority_or_automation
abstention:
  no_anchor: true
  no_supported_action: true
  uncertainty_abstain: true
  contradictory_evidence: true
  default_action_on_abstain: null
automation_order: [ABSTAIN, PARTIAL, FULL]
reason_lineage_required: true
deterministic_action_order: catalog_order
provenance:
  source_commit: 0c29afddb55bf57f4edd54dda32669869acce370
  phase1_authority: configs/recommend_hybrid/model_authority.yaml
  phase2_foundation: reports/recommend_hybrid/PHASE_2_RESULTS.md
