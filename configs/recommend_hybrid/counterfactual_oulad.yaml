version: counterfactual_oulad_effects_v1
claim_boundary: MODEL_ESTIMATED_RISK_REDUCTION_NOT_CAUSAL_EFFECT
reference_scope: TRAINING_FOLD_COURSE_STAGE_ONLY
mutable_features:
  - activity_level
  - inactivity_streak
  - assessment_progress
  - recent_activity_trend
  - total_activity
  - recent_activity
  - average_activity
  - assessments_due
  - assessments_completed
protected_features:
  - course_progress
  - grade_trend
  - cutoff_day
  - requested_cutoff
  - stage
  - student_key
  - course_key
  - predicted_class
  - final_result
  - date_unregistration
utility:
  version: counterfactual_utility_v1
  minimum_risk_reduction: 0.01
  workload_scale_minutes: 60.0
actions:
  - action_id: VLE_ENGAGEMENT
    scorable: true
    effects:
      - feature: activity_level
        operator: max_reference
        reference_key: activity_level_p65
        lower_bound: 0.0
      - feature: inactivity_streak
        operator: reduce_fraction
        amount: 0.50
        lower_bound: 0.0
      - feature: recent_activity_trend
        operator: max_value
        amount: 0.0
  - action_id: ASSESSMENT_COMPLETION
    scorable: true
    effects:
      - feature: assessment_progress
        operator: increase_fraction_of_gap
        amount: 0.25
        lower_bound: 0.0
        upper_bound: 1.0
      - feature: assessments_completed
        operator: add
        amount: 1.0
        lower_bound: 0.0
      - feature: assessments_due
        operator: subtract
        amount: 1.0
        lower_bound: 0.0
  - action_id: STUDY_SCHEDULE
    scorable: true
    effects:
      - feature: inactivity_streak
        operator: reduce_fraction
        amount: 0.35
        lower_bound: 0.0
      - feature: recent_activity_trend
        operator: max_value
        amount: 0.0
  - action_id: RETRIEVAL_PRACTICE
    scorable: true
    effects:
      - feature: activity_level
        operator: max_reference
        reference_key: activity_level_p50
        lower_bound: 0.0
      - feature: recent_activity
        operator: max_reference
        reference_key: recent_activity_p50
        lower_bound: 0.0
  - action_id: TARGETED_PRACTICE
    scorable: true
    effects:
      - feature: recent_activity
        operator: max_reference
        reference_key: recent_activity_p65
        lower_bound: 0.0
      - feature: assessment_progress
        operator: increase_fraction_of_gap
        amount: 0.10
        lower_bound: 0.0
        upper_bound: 1.0
  - action_id: LEARNING_CONSOLIDATION
    scorable: true
    effects:
      - feature: activity_level
        operator: max_reference
        reference_key: activity_level_p50
        lower_bound: 0.0
      - feature: recent_activity
        operator: max_reference
        reference_key: recent_activity_p50
        lower_bound: 0.0
  - action_id: DIAGNOSTIC_CHECK
    scorable: false
    non_scorable_reason: NO_DIRECT_MODEL_FEATURE_EFFECT
  - action_id: PROGRESS_MONITORING
    scorable: false
    non_scorable_reason: FOLLOW_UP_ACTION_NOT_PRIMARY_INTERVENTION
  - action_id: INSTRUCTOR_CONTACT
    scorable: false
    non_scorable_reason: HUMAN_SUPPORT_ACTION_REQUIRES_POLICY_FALLBACK
  - action_id: ADVISOR_ESCALATION
    scorable: false
    non_scorable_reason: HUMAN_SUPPORT_ACTION_REQUIRES_POLICY_FALLBACK
