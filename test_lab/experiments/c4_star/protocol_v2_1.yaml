seeds_screen: [42, 1201, 2026]
n_inner: 3
split_seed: 42
development_outer_fold: 0
material_floor: 0.010
material_scale: 0.10
cold_guardrail:
  "uci:S0": 0.05
  "oulad:20pct": 0.02
dt_timeout_sec: 90
temp_hard_c: 80
max_epochs: 40
patience: 10
bootstrap_replicates: 10000
speed_finish_not_confirmatory: true
gemini_in_prediction_hpo: false
one_checkpoint_scores_all_stages: true
