schema_version: student_por_v5_1_protocol_v1
protocol_status: frozen_before_outer_evaluation
dataset: student-por
source:
  path: data/raw/student-por.csv
  sha256: a7594a11d7771c0efe1a740824e0e833da9c4cad07c39a9766a874575563fb3f
  delimiter: ";"
  expected_rows: 649
target:
  source_column: G3
  classification: {low: [0, 9], medium: [10, 14], high: [15, 20]}
  regression: raw_G3_0_to_20
  G3_as_input: PROHIBITED

features:
  temporal_source: [G1, G2]
  temporal_channels:
    - normalized_grade
    - stage_indicator
    - signed_change_from_G1
    - absolute_change_from_G1
    - signed_distance_to_boundary_10
    - signed_distance_to_boundary_15
    - change_direction
  construction: deterministic_from_G1_G2_only
  ml_receives_equivalent_flattened_temporal_features: true
  primary_safe_context: [failures, studytime, schoolsup, famsup, paid, activities, internet, higher, traveltime, freetime, goout, health]
  primary_context_excludes: [absences]
  sensitivity_only_context: [absences]
  sensitive_primary_exclusions: [sex, age, address, famsize, Pstatus, Mjob, Fjob]
  preprocessing: fit_current_training_partition_only
  unknown_category: ignore_with_all_zero_onehot

splits:
  outer_manifest: artifacts/v5/student_por/split_manifest.csv
  outer_manifest_sha256: 2ea07b2d17714fc9df3eec23150579090d245a1a45f33270b2864c88653d2de2
  outer_folds: 5
  inner_folds: 3
  inner_method: StratifiedGroupKFold_with_conservative_quasi_identity
  split_seed: 1201
  cross_subject_results_are_external_validation: false

architecture:
  temporal:
    input_projection: [16, 24, 32]
    parallel_kernels: [[1, 2]]
    channels_per_branch: [8, 16, 24, 32, 48]
    activation: [GELU, ReLU]
    normalization: LayerNorm
    residual_projection: required
    dropout: [0.05, 0.15, 0.25, 0.40]
    bilstm_layers: [1, 2]
    bilstm_hidden: [16, 24, 32, 48, 64]
  context:
    layers: [1, 2]
    hidden: [16, 24, 32, 48, 64, 96]
    normalization: LayerNorm
    max_size_relative_to_temporal: not_larger
  fusion_candidates: [concatenation, gated, film_residual]
  objectives: [classification_only, classification_plus_huber_regression, classification_plus_huber_regression_plus_ordinal]
  regression_weight_candidates: [0.05, 0.10, 0.20]
  ordinal_weight_candidates: [0.025, 0.05, 0.10]
  parameter_limit: 1500000

comparators:
  primary: random_forest
  standard: [logistic_regression, decision_tree, random_forest, svm]
  extended: [hist_gradient_boosting]
  fair_raw_information: [G1, G2, primary_safe_context]
  imbalance_tabular: [none, class_weight, random_oversampling, smote, adasyn]
  imbalance_deep: [none, class_weight, random_sample_duplication, focal]

search:
  round_a_trials_per_component_group: 12
  round_a_component_groups: [fusion, objective, imbalance]
  round_a_seeds: [42, 2026, 3407]
  round_b_trials_min: 40
  round_b_trials_max: 80
  storage: artifacts/v5_1/student_por/optuna.db
  sampler_seed: 7319
  plateau_non_improving_trials: 15

evaluation:
  seeds: [42, 1201, 2026, 3407, 7319]
  primary_metric: macro_f1
  primary_comparator: random_forest
  baseline_v5_macro_f1: 0.8491516177055304
  directional_target_macro_f1: 0.86
  metrics: [accuracy, macro_f1, weighted_f1, per_class_precision_recall_f1, macro_pr_auc, rmse, r2]
  performance_target_is_gate: false

artifacts:
  root: artifacts/v5_1/student_por
  report_root: reports/v5_1/student_por
  future_accessed: false

