name: Stage-Aware Causal Recommendation

on:
  pull_request:
    paths:
      - "src/recommend_hybrid/final/**"
      - "src/recommend_hybrid/causal/**"
      - "scripts/recommend_hybrid/final/**"
      - "scripts/recommend_hybrid/causal/**"
      - "scripts/recommend_hybrid/run_complete_stage_aware_recommendation.py"
      - "scripts/recommend_hybrid/validate_complete_stage_aware_release.py"
      - "tests/recommend_hybrid/test_stage_aware_causal.py"
      - "tests/recommend_hybrid/test_study_regularity_treatment.py"
      - "tests/recommend_hybrid/test_frozen_hybrid_imbalance.py"
      - "tests/recommend_hybrid/test_four_stage_action_head.py"
      - "configs/recommend_hybrid/stage_aware_causal.yaml"
      - ".github/workflows/stage-aware-causal-recommendation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without large LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy pandas scipy scikit-learn imbalanced-learn pyarrow PyYAML \
            pytest ruff psycopg2-binary python-dotenv

      - name: Compile changed scope
        run: |
          python -m compileall \
            src/recommend_hybrid/final \
            src/recommend_hybrid/causal \
            scripts/recommend_hybrid/final \
            scripts/recommend_hybrid/causal \
            scripts/recommend_hybrid/run_complete_stage_aware_recommendation.py \
            scripts/recommend_hybrid/validate_complete_stage_aware_release.py

      - name: Run stage-aware unit tests
        run: |
          python -m pytest \
            tests/recommend_hybrid/test_stage_aware_causal.py \
            tests/recommend_hybrid/test_study_regularity_treatment.py \
            tests/recommend_hybrid/test_frozen_hybrid_imbalance.py \
            tests/recommend_hybrid/test_four_stage_action_head.py \
            -q

      - name: Ruff changed scope
        run: |
          ruff check \
            src/recommend_hybrid/final \
            src/recommend_hybrid/causal \
            scripts/recommend_hybrid/final \
            scripts/recommend_hybrid/causal \
            scripts/recommend_hybrid/run_complete_stage_aware_recommendation.py \
            scripts/recommend_hybrid/validate_complete_stage_aware_release.py \
            tests/recommend_hybrid/test_stage_aware_causal.py \
            tests/recommend_hybrid/test_study_regularity_treatment.py \
            tests/recommend_hybrid/test_frozen_hybrid_imbalance.py \
            tests/recommend_hybrid/test_four_stage_action_head.py
