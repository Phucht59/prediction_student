name: Final Recommendation Release

on:
  push:
    branches:
      - main
      - release/recommendation-main
  pull_request:
    paths:
      - "src/recommend_hybrid/final/**"
      - "src/recommend_hybrid/__init__.py"
      - "src/recommend_hybrid/README.md"
      - "configs/recommend_hybrid/final/**"
      - "scripts/recommend_hybrid/final/**"
      - "tests/recommend_hybrid/final/**"
      - "artifacts/recommend_hybrid/final/**"
      - "reports/recommend_hybrid/final/**"
      - ".github/workflows/final-recommendation-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy pandas scipy scikit-learn pyarrow PyYAML pytest ruff joblib \
            psycopg2-binary python-dotenv

      - name: Verify canonical evidence copies
        run: |
          cmp \
            artifacts/recommend_hybrid/final/release/FINAL_RELEASE_MANIFEST.json \
            artifacts/recommend_hybrid/explainable_v2/frozen/final_release_v1/FINAL_RELEASE_MANIFEST.json
          cmp \
            artifacts/recommend_hybrid/final/heldout/PANEL_B_FINAL_HELDOUT_METRICS.json \
            artifacts/recommend_hybrid/explainable_v2/final_heldout/panel_b_v1/PANEL_B_FINAL_HELDOUT_METRICS.json
          python scripts/recommend_hybrid/final/verify_release.py

      - name: Run final namespace tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/recommend_hybrid/final -q > /tmp/final-pytest.log 2>&1
          status=$?
          cat /tmp/final-pytest.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 30 /tmp/final-pytest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Final namespace pytest::${summary}"
            exit "$status"
          fi

      - name: Import final public API
        run: |
          python -c "from src.recommend_hybrid import RecommendationPipeline, FiveEBMRanker; from src.recommend_hybrid.final import RouteStatus; print(RecommendationPipeline.__name__, FiveEBMRanker.__name__, sorted(x.value for x in RouteStatus))"

      - name: Compile final recommendation scope
        run: |
          python -m py_compile \
            src/recommend_hybrid/final/__init__.py \
            src/recommend_hybrid/__init__.py \
            scripts/recommend_hybrid/final/verify_release.py \
            tests/recommend_hybrid/final/test_public_api.py \
            tests/recommend_hybrid/final/test_release_evidence.py

      - name: Ruff final recommendation scope
        run: |
          ruff check \
            src/recommend_hybrid/final \
            src/recommend_hybrid/__init__.py \
            scripts/recommend_hybrid/final \
            tests/recommend_hybrid/final
