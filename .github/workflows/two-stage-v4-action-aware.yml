name: Action-Aware Integrated Two-Stage V4

on:
  pull_request:
    paths:
      - "configs/recommend_hybrid/two_stage_v4_protocol.yaml"
      - "src/recommend_hybrid/two_stage_v4/**"
      - "scripts/recommend_hybrid/two_stage_v4/**"
      - "tests/recommend_hybrid/two_stage_v4/**"
      - ".github/workflows/two-stage-v4-action-aware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-aware-v4-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy pandas pyarrow PyYAML scikit-learn pytest ruff
          python -m pip install \
            torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run V4 tests
        run: |
          python -m pytest \
            --confcutdir=tests/recommend_hybrid/two_stage_v4 \
            tests/recommend_hybrid/two_stage_v4 \
            -q

      - name: Compile V4 scope
        run: |
          python -m py_compile \
            src/recommend_hybrid/two_stage_v4/__init__.py \
            src/recommend_hybrid/two_stage_v4/model.py \
            src/recommend_hybrid/two_stage_v4/metrics.py \
            src/recommend_hybrid/two_stage_v4/selection.py \
            scripts/recommend_hybrid/two_stage_v4/train_and_evaluate.py \
            scripts/recommend_hybrid/two_stage_v4/bootstrap.py \
            scripts/recommend_hybrid/two_stage_v4/verify.py \
            scripts/recommend_hybrid/two_stage_v4/release.py \
            scripts/recommend_hybrid/two_stage_v4/render_report.py \
            scripts/recommend_hybrid/two_stage_v4/feasibility_audit.py

      - name: Ruff V4 scope
        run: |
          ruff check \
            src/recommend_hybrid/two_stage_v4 \
            scripts/recommend_hybrid/two_stage_v4 \
            tests/recommend_hybrid/two_stage_v4
