name: Recommendation V2 Scientific Optimization

on:
  push:
    branches:
      - codex/recommendation-v2-scientific-optimization
    paths:
      - "src/recommend_hybrid/v2/**"
      - "scripts/recommend_hybrid/v2/**"
      - "tests/recommend_hybrid/test_recommendation_v2.py"
      - "configs/recommend_hybrid/recommendation_v2.yaml"
      - ".github/workflows/recommendation-v2.yml"
  pull_request:
    paths:
      - "src/recommend_hybrid/v2/**"
      - "scripts/recommend_hybrid/v2/**"
      - "tests/recommend_hybrid/test_recommendation_v2.py"
      - "configs/recommend_hybrid/recommendation_v2.yaml"
      - ".github/workflows/recommendation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without large LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scipy scikit-learn pyarrow PyYAML pytest ruff joblib

      - name: Compile Recommendation V2
        run: |
          python -m compileall \
            src/recommend_hybrid/v2 \
            scripts/recommend_hybrid/v2

      - name: Run Recommendation V2 unit tests
        run: |
          python -m pytest tests/recommend_hybrid/test_recommendation_v2.py -q

      - name: Ruff Recommendation V2
        run: |
          ruff check \
            src/recommend_hybrid/v2 \
            scripts/recommend_hybrid/v2 \
            tests/recommend_hybrid/test_recommendation_v2.py
