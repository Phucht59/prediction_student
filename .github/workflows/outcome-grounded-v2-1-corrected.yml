name: Historical Outcome-Grounded V2.1 Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow is retained only for reproducibility of the retired
# XGBoost/LambdaMART research experiment. The final thesis architecture is
# hybrid-only and is validated by hybrid-only-final.yml. Historical V2.1 must
# not block or authorize the final runtime release.
jobs:
  focused-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy pandas scipy scikit-learn pyarrow PyYAML joblib pytest ruff

      - name: Run historical scientific invariant tests
        run: |
          python -m pytest \
            --confcutdir=tests/recommend_hybrid/outcome_grounded_v2_1 \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_corrected_scientific_core.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_full_registered_execution.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_resumable_authority.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_parallel_control_dispatcher.py \
            -q

      - name: Enforce final hybrid-only runtime authority
        run: |
          python -m pytest \
            --confcutdir=tests/recommend_hybrid \
            tests/recommend_hybrid/test_final_hybrid_only_authority.py \
            -q

      - name: Compile historical evaluators
        run: |
          python -m py_compile \
            scripts/recommend_hybrid/v2_1/scientific_core.py \
            scripts/recommend_hybrid/v2_1/corrected_nested_evaluation.py \
            scripts/recommend_hybrid/v2_1/corrected_bootstrap.py \
            scripts/recommend_hybrid/v2_1/corrected_negative_controls.py \
            scripts/recommend_hybrid/v2_1/corrected_ablation.py \
            scripts/recommend_hybrid/v2_1/corrected_release.py \
            scripts/recommend_hybrid/v2_1/run_full_registered_search.py \
            scripts/recommend_hybrid/v2_1/run_resumable_full_registered_search.py \
            scripts/recommend_hybrid/v2_1/retry_failed_full_grid_trials.py \
            scripts/recommend_hybrid/v2_1/postsearch_authority.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_negative_controls.py \
            scripts/recommend_hybrid/v2_1/run_parallel_authority_controls.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_ablation.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_release.py

      - name: Ruff historical scope
        run: |
          ruff check \
            scripts/recommend_hybrid/v2_1/scientific_core.py \
            scripts/recommend_hybrid/v2_1/corrected_nested_evaluation.py \
            scripts/recommend_hybrid/v2_1/corrected_bootstrap.py \
            scripts/recommend_hybrid/v2_1/corrected_negative_controls.py \
            scripts/recommend_hybrid/v2_1/corrected_ablation.py \
            scripts/recommend_hybrid/v2_1/corrected_release.py \
            scripts/recommend_hybrid/v2_1/run_full_registered_search.py \
            scripts/recommend_hybrid/v2_1/run_resumable_full_registered_search.py \
            scripts/recommend_hybrid/v2_1/retry_failed_full_grid_trials.py \
            scripts/recommend_hybrid/v2_1/postsearch_authority.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_negative_controls.py \
            scripts/recommend_hybrid/v2_1/run_parallel_authority_controls.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_ablation.py \
            scripts/recommend_hybrid/v2_1/run_authority_bound_release.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_corrected_scientific_core.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_full_registered_execution.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_resumable_authority.py \
            tests/recommend_hybrid/outcome_grounded_v2_1/test_parallel_control_dispatcher.py \
            tests/recommend_hybrid/test_final_hybrid_only_authority.py
