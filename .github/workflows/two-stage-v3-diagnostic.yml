name: Two-Stage V3 Diagnostic

on:
  pull_request:
    paths:
      - "configs/recommend_hybrid/two_stage_v3_protocol.yaml"
      - "scripts/recommend_hybrid/two_stage_v3/**"
      - "tests/recommend_hybrid/two_stage_v3/**"
      - ".github/workflows/two-stage-v3-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow PyYAML pytest ruff

      - name: Run tests
        run: |
          python -m pytest \
            --confcutdir=tests/recommend_hybrid/two_stage_v3 \
            tests/recommend_hybrid/two_stage_v3 \
            -q

      - name: Compile
        run: |
          python -m py_compile scripts/recommend_hybrid/two_stage_v3/diagnose.py

      - name: Ruff
        run: |
          ruff check \
            scripts/recommend_hybrid/two_stage_v3 \
            tests/recommend_hybrid/two_stage_v3
