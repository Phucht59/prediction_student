name: Historical Two-Stage V3 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# V3 is immutable historical evidence. The current recommendation authority is
# Action-Aware Two-Stage V4. This workflow remains available for manual
# reproducibility and must not block later architecture commits.
jobs:
  diagnostic-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install historical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy pandas pyarrow PyYAML joblib scikit-learn pytest ruff
          python -m pip install \
            torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run historical V3 tests
        run: |
          python -m pytest \
            --confcutdir=tests/recommend_hybrid/two_stage_v3 \
            tests/recommend_hybrid/two_stage_v3 \
            -q

      - name: Compile historical V3 scope
        run: |
          python -m py_compile \
            scripts/recommend_hybrid/two_stage_v3/diagnose.py \
            scripts/recommend_hybrid/two_stage_v3/repair_opportunity_count.py

      - name: Ruff historical V3 scope
        run: |
          ruff check \
            scripts/recommend_hybrid/two_stage_v3 \
            tests/recommend_hybrid/two_stage_v3
