name: Counterfactual Real Checkpoint Smoke

on:
  pull_request:
    paths:
      - "src/recommend_hybrid/counterfactual/**"
      - "src/recommend_hybrid/prediction_adapter.py"
      - "src/recommend_hybrid/checkpoint_authority.py"
      - "configs/recommend_hybrid/counterfactual_oulad_tensor.yaml"
      - "scripts/recommend_hybrid/smoke_real_checkpoint_counterfactual.py"
      - "scripts/recommend_hybrid/validate_checkpoint_authority.py"
      - ".github/workflows/counterfactual-real-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository and LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused checkpoint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy pandas scikit-learn joblib \
            torch PyYAML

      - name: Verify frozen authorities
        run: |
          for path in \
            artifacts/recommend_hybrid/RECOMMEND_HYBRID_CHECKPOINT_MANIFEST.json \
            artifacts/canonical_v3/oulad_h1_training_authority.json; do
            if [[ ! -f "$path" ]]; then
              echo "Missing frozen authority: $path" >&2
              exit 1
            fi
            echo "Found frozen authority: $path"
          done

      - name: Validate structural checkpoint authority
        run: python scripts/recommend_hybrid/validate_checkpoint_authority.py

      - name: Run real checkpoint counterfactual smoke
        run: python scripts/recommend_hybrid/smoke_real_checkpoint_counterfactual.py

      - name: Upload real checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-real-checkpoint-smoke
          path: artifacts/recommend_hybrid/counterfactual/real_checkpoint_smoke.json
          if-no-files-found: warn
