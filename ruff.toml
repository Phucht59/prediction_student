# Keep correctness-oriented E/F checks active across public source and tests.
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    ".venv-oulad",
    ".venv-oulad-v2",
    "artifacts",
    "data",
    "reports",
]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402", "E701", "E702", "E703", "E731", "F401", "F541", "F811", "F841"]
